services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: macrolens
      POSTGRES_PASSWORD: macrolens
      POSTGRES_DB: macrolens
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macrolens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://macrolens:macrolens@db:5432/macrolens
      MACROLENS_DATA_DIR: /app/data
      MACROLENS_REPORTS_DIR: /app/reports
      # Valeur de repli UNIQUEMENT pour le développement local (jamais exposé
      # publiquement) — un déploiement partagé DOIT fixer un ADMIN_TOKEN fort
      # dans l'environnement avant de démarrer (voir README § « Créer un lien
      # solide et un accès administrateur »). Sinon /admin reste guessable.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-macrolens-dev-admin}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

  # Origine unique pour l'accès partagé (README § « Partager un lien
  # public ») : le frontend appelle l'API en chemin relatif (/api/v1/...),
  # donc ce proxy fonctionne derrière n'importe quelle URL de tunnel sans
  # jamais avoir besoin de reconstruire l'image quand cette URL change.
  proxy:
    image: nginx:alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web
      - api

volumes:
  db_data:
