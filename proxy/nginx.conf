# Reverse-proxy unique pour l'accès partagé (README § « Partager un lien
# public »). Regroupe le frontend et l'API sous une seule origine afin que
# le frontend puisse appeler l'API en chemin relatif (/api/v1/...) — donc
# fonctionne tel quel derrière n'importe quelle URL de tunnel, sans jamais
# avoir besoin de reconstruire l'image quand cette URL change, et sans CORS.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Utile pour vérifier l'état de l'API via le même lien partagé.
    location = /health {
        proxy_pass http://api:8000/health;
    }

    location = /docs {
        proxy_pass http://api:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    location / {
        proxy_pass http://web:5173/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
