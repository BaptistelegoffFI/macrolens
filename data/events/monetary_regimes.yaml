# Changements de régime monétaire (§8.2.3 : sert de base à reference_frame=era).
# Portée volontairement limitée en Phase 1 aux sorties de l'étalon-or (années
# vérifiées par recherche le 2026-08-12) et aux régimes du XXe siècle bien
# documentés. L'adoption de l'étalon-or (1870s-1880s, précision au jour
# incertaine pour plusieurs pays) est laissée à data/reference/monetary_regimes.yaml
# (Phase 4, §8.2.3) plutôt que fabriquée ici sans source vérifiée — voir
# docs/decisions/0001-ambiguites-plan-phase-1.md.

- country: DEU
  date_start: 1931-07-15
  kind: monetary_regime
  label_fr: "Sortie de fait de l'étalon-or (crise du Danat Bank, contrôle des changes)"
  label_en: "De facto exit from the gold standard"
  severity: 4
  source_id: events_manual
  source_url: "https://cepr.org/voxeu/columns/scylla-and-charybdis-what-europes-exit-gold-1930s-says-about-euro"
  notes_fr: >
    Année confirmée par recherche (2026-08-12, CEPR/VoxEU). Le jour exact
    (déclenché par la faillite du Danat Bank le 13 juillet 1931 et les
    accords de moratoire qui suivent) est approximatif.

