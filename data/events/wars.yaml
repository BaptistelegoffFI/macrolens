# Guerres majeures affectant les pays du périmètre (§7.4 : flag `wartime`
# dérivé de cette table). country: null = événement global (concerne tous les
# pays du pool). Dates de notoriété publique bien établie — chaque entrée
# porte sa propre source_url vérifiable.

- country: null
  date_start: 1914-07-28
  date_end: 1918-11-11
  kind: war
  label_fr: "Première Guerre mondiale"
  label_en: "World War I"
  severity: 5
  source_id: events_manual
  source_url: "https://en.wikipedia.org/wiki/World_War_I"
  notes_fr: >
    Dates de déclaration de guerre (28 juillet 1914) et d'armistice
    (11 novembre 1918). Concerne directement FRA, DEU, ITA ; affecte
    l'ensemble du pool via le commerce, la dette de guerre et l'inflation.

- country: null
