# Référentiel pays — PLAN.md §2.1.
# is_core: les 6 pays cibles du brief (affichés comme pays principaux dans l'UI).
# in_analog_pool: entre dans la recherche d'analogues (tous les 17, cœur + contrôle).
# currency_hist: historique simplifié des monnaies (année de début, année de fin —
# null = monnaie actuelle). Métadonnée contextuelle d'affichage, distincte des taux
# de conversion sourcés de data/reference/currency_changes.yaml (§7.3, Phase 3).

- iso3: FRA
  name_en: France
  name_fr: France
  is_core: true
  in_analog_pool: true
  currency_hist:
    - { currency: "Franc français", from: 1870, to: 1999 }
    - { currency: "Euro", from: 1999, to: null }

- iso3: DEU
  name_en: Germany
  name_fr: Allemagne
  is_core: true
  in_analog_pool: true
  currency_hist:
    - { currency: "Mark (Empire allemand)", from: 1873, to: 1914 }
    - { currency: "Mark / Papiermark (hyperinflation)", from: 1914, to: 1923 }
    - { currency: "Rentenmark puis Reichsmark", from: 1923, to: 1948 }
    - { currency: "Deutsche Mark (RFA) / Ostmark (RDA)", from: 1948, to: 1990 }
    - { currency: "Deutsche Mark (Allemagne réunifiée)", from: 1990, to: 1999 }
    - { currency: "Euro", from: 1999, to: null }
  note: >
    Ruptures territoriales et statistiques 1914-1924, 1939-1949, 1990 (§7.4) —
    observations flaguées is_break=true, exclues du pool par défaut.

