name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (lint → types → tests → build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: macrolens
          POSTGRES_PASSWORD: macrolens
          POSTGRES_DB: macrolens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macrolens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://macrolens:macrolens@localhost:5432/macrolens
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Types (mypy)
        working-directory: backend
        run: uv run mypy macrolens

      - name: Migrate (alembic)
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Seed reference data
        working-directory: backend
        run: uv run macrolens seed

      - name: Tests (pytest)
        working-directory: backend
        run: uv run pytest

      - name: Build
        working-directory: backend
        run: uv build

  frontend:
    name: frontend (lint → types → tests → build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Types (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Tests (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
